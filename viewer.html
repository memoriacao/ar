<!DOCTYPE html>
<html lang="pt-BR">
	<head>
		<meta charset="UTF-8">
		<meta name="viewport" content="width=device-width, initial-scale=1.0">
		<title> Campus quest Arviewer </title>
		<meta name="viewport" content="width=device-width, initial-scale=1.0">
		<meta name="robots" content="noindex, nofollow, noarchive, nosnippet">
		<meta name="googlebot" content="noindex, nofollow, noarchive, nosnippet">
		<meta name="bingbot" content="noindex, nofollow, noarchive, nosnippet">
		<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet" />

		<script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
		<script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
		
		<style>
		    .a-enter-vr { display: none !important;}

			#ui-guide {
		        position: fixed;
		        top: 20px;
		        left: 50%;
		        transform: translateX(-50%);
		        background: rgba(0, 0, 0, 0.6);
		        backdrop-filter: blur(5px); 
		        color: white;
		        padding: 8px 20px;
		        border-radius: 30px;
		        display: flex;
		        gap: 25px;
		        z-index: 9999;
		        font-family: Arial, sans-serif;
		        box-shadow: 0 4px 10px rgba(0,0,0,0.3);
		        pointer-events: none; 
		        animation: fadeOut 1s ease-in-out 8s forwards;
		    }

		    .guide-item {
		        display: flex;
		        align-items: center;
		        gap: 6px;
		        font-size: 14px;
		        font-weight: bold;
		    }

		    @keyframes fadeOut {
		        from { opacity: 1; }
		        to { opacity: 0; display: none; }
		    }
		</style>
		<script>
		    AFRAME.registerComponent('gesture-handler', {
		        init: function () {
		            this.touchStart = this.touchStart.bind(this);
		            this.touchMove = this.touchMove.bind(this);
		            this.touchEnd = this.touchEnd.bind(this);

		            this.el.sceneEl.addEventListener('touchstart', this.touchStart);
		            this.el.sceneEl.addEventListener('touchmove', this.touchMove);
		            this.el.sceneEl.addEventListener('touchend', this.touchEnd);

		            this.isDragging = false;
		            this.previousTouch = null;
		            this.initialPinchDistance = null;
		            this.initialScale = null;
		        },

		        touchStart: function (evt) {
		            if (evt.touches.length === 1) {
		                this.isDragging = true;
		                this.previousTouch = { x: evt.touches[0].pageX, y: evt.touches[0].pageY };
		            } else if (evt.touches.length === 2) {
		                this.isDragging = false;
		                this.initialPinchDistance = this.getDistance(evt.touches);
		                this.initialScale = this.el.object3D.scale.clone();
		            }
		        },

		        touchMove: function (evt) {
		            if (evt.touches.length === 1 && this.isDragging) {

		                const deltaX = evt.touches[0].pageX - this.previousTouch.x;
		                const deltaY = evt.touches[0].pageY - this.previousTouch.y;
		                
		                this.el.object3D.rotation.y += deltaX * 0.01;
		                this.el.object3D.rotation.x += deltaY * 0.01;
		                
		                this.previousTouch = { x: evt.touches[0].pageX, y: evt.touches[0].pageY };
		                
		            } else if (evt.touches.length === 2 && this.initialPinchDistance) {
		                const currentDistance = this.getDistance(evt.touches);
		                const scaleFactor = currentDistance / this.initialPinchDistance;
		                
		                this.el.object3D.scale.set(
		                    this.initialScale.x * scaleFactor,
		                    this.initialScale.y * scaleFactor,
		                    this.initialScale.z * scaleFactor
		                );
		            }
		        },

		        touchEnd: function (evt) {
		            if (evt.touches.length < 2) {
		                this.initialPinchDistance = null;
		            }
		            if (evt.touches.length === 0) {
		                this.isDragging = false;
		            }
		        },

		        getDistance: function (touches) {
		            const dx = touches[0].pageX - touches[1].pageX;
		            const dy = touches[0].pageY - touches[1].pageY;
		            return Math.sqrt(dx * dx + dy * dy);
		        }
		    });
	    </script>
	</head>
	<body>
		<div id="ui-guide">
		    <div class="guide-item">
		        <span class="material-symbols-outlined">swipe</span>
		        <span>Girar</span>
		    </div>
		    <div class="guide-item">
		        <span class="material-symbols-outlined">pinch</span>
		        <span>Zoom</span>
		    </div>
	    </div>
		<a-scene
		    mindar-image="imageTargetSrc: targets.mind;"
		    vr-mode-ui="enabled: false"
		    device-orientation-permission-ui="enabled: false">
		    <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>
		    <a-entity id="alvo-ar" mindar-image-target="targetIndex: 0"></a-entity>
		</a-scene>

		<script>
		    const params = new URLSearchParams(window.location.search);
		    const modelName = params.get('m');
		    const category = params.get('c');
		    const scale = parseFloat(params.get('s')) || 1;
		    const zoom = parseFloat(params.get('z')) || 1;
		    const position = params.get('p') || '0,0,0';
		    const rotation = params.get('r') || '0,0,0';

		    if (!modelName || !category) {
		        alert("Modelo (m) ou Categoria (c) não informados na URL.");
		    } else {
		        const modelUrl = encodeURIComponent(modelName);
		        const finalScale = scale * zoom;
		        
		        const model = document.createElement('a-gltf-model');
		        model.setAttribute('src', modelUrl);
		        model.setAttribute('position', position.replace(/,/g, ' '));
		        model.setAttribute('rotation', rotation.replace(/,/g, ' '));
		        model.setAttribute('scale', `${finalScale} ${finalScale} ${finalScale}`);
				model.setAttribute('gesture-handler', '');
		        document.getElementById('alvo-ar').appendChild(model);
		    }
		</script>
	</body>
</html>
